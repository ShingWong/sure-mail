[package]
name = "wasi-runner"
version = "0.1.0"
edition = "2021"
description = "Minimal wasmtime embedding that runs the WASI 0.2 socket-server component with TCP/name-lookup/network enabled. Cross-compiled to Android so the emulator can execute the same .wasm as Linux/Windows."
license = "UNLICENSED"
publish = false

[[bin]]
name = "wasi-runner"
path = "src/main.rs"

[dependencies]
# Pinned to the runtime version proven on Linux/Windows (wasmtime 49.0.2).
wasmtime = "=49.0.2"
wasmtime-wasi = "=49.0.2"

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
